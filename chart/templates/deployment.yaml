apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-remote-debugger.fullname" . }}
  labels:
    {{- include "k8s-remote-debugger.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-remote-debugger.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-remote-debugger.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- if .Values.debug.enabled }}
            - python
            - -m
            - debugpy
            - --listen
            - 0.0.0.0:{{ .Values.debug.port }}
            {{- if .Values.debug.waitForClient }}
            - --wait-for-client
            {{- end }}
            - -m
            - uvicorn
            - main:app
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.service.targetPort }}"
            {{- else }}
            - uvicorn
            - main:app
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.service.targetPort }}"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
            {{- if .Values.debug.enabled }}
            - name: debugpy
              containerPort: {{ .Values.debug.port }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
